# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_l_controller
    - hand_l_controller
    - arm_r_controller
    - hand_r_controller

  arm_l_controller:
    type: FollowJointTrajectory
    joints:
      - A_left_Degree1_joint
      - A_left_Degree2_joint
      - A_left_Degree3_joint
      - A_left_Degree4_joint
      - A_left_Degree5_joint
      - A_left_Degree6_joint
      - A_left_Degree7_joint
    action_ns: follow_joint_trajectory
    default: true
  hand_l_controller:
    type: GripperCommand
    joints:
      - A_left_Degree8_joint
      - A_left_Degree9_joint
    action_ns: gripper_cmd
    default: true
  arm_r_controller:
    type: FollowJointTrajectory
    joints:
      - A_right_Degree1_joint
      - A_right_Degree2_joint
      - A_right_Degree3_joint
      - A_right_Degree4_joint
      - A_right_Degree5_joint
      - A_right_Degree6_joint
      - A_right_Degree7_joint
    action_ns: follow_joint_trajectory
    default: true
  hand_r_controller:
    type: GripperCommand
    joints:
      - A_right_Degree8_joint
      - A_right_Degree9_joint
    action_ns: gripper_cmd
    default: true